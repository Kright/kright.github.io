url: "https://kright.me"
title: "Kright"
description: "Мои заметки про программирование, геймдев и геометрическую алгебру"
author: "Kright"

lsi: false
safe: true
source: .
incremental: false
highlighter: rouge
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
gist:
  noscript: false
markdown: kramdown
kramdown:
  input: GFM
  math_engine: mathjax
  syntax_highlighter: rouge

# Язык по умолчанию - русский, всё что лежит в /en - английское.
# Пары переводов связываются через одинаковый `ref` во front matter.
defaults:
  - scope:
      path: ""
    values:
      lang: ru
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "en"
    values:
      lang: en

exclude:
  - Gemfile
  - Gemfile.lock
  - update_and_push.sh
